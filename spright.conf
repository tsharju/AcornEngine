# Spright Packing Configuration for Medieval Characters
max-width 1024
max-height 1024
power-of-two true

# Output description configuration
output "Samples/AcornSampleApp/AcornSampleApp/Resources/characters{0-}.png"
description "Samples/AcornSampleApp/AcornSampleApp/Resources/characters.json"
  template ".agents/skills/spright-spritesheet-skill/templates/acorn.inja"

# Input frames configuration
id "{{ source.filenameStem }}"
glob "scratch/character_frames/*.png"
